<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>High Templater - 웹 템플릿 허브</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#ffffff 0%,#f9f9f9 100%);
  color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding-bottom:100px; /* 광고 공간 확보 */
}
header{
  width:100%;text-align:center;padding:60px 20px 40px 20px;
  border-bottom:1px solid #eee;
}
h1{font-size:2.5rem;font-weight:700;}
p.sub{margin-top:10px;color:#666;font-size:1rem;}
main{
  flex:1;width:100%;max-width:1200px;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:24px;justify-items:center;padding:40px 20px;
}
@media(max-width:980px){main{grid-template-columns:repeat(3,1fr);} }
@media(max-width:640px){main{grid-template-columns:repeat(2,1fr);} }

/* 카드 */
.card{
  position:relative;overflow:hidden;
  width:100%;aspect-ratio:1/1;
  border-radius:18px;border:1px solid #eee;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  background:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .3s ease,box-shadow .3s ease;
}
.card:hover{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 6px 16px rgba(0,0,0,0.15);
}
.card::before{
  content:"";position:absolute;top:0;left:0;width:100%;height:6px;
  background:var(--accent);border-radius:18px 18px 0 0;z-index:2;
}
.bg-thumb{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0.25;filter:blur(6px) brightness(1.1);
  transition:opacity .4s ease,filter .4s ease,transform .4s ease,z-index .4s ease;
  z-index:0;
}
.card:hover .bg-thumb{
  opacity:0.9;filter:blur(0) brightness(1);transform:scale(1.05);z-index:6;
}
.content{
  position:relative;z-index:5;text-align:center;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(4px);
  border-radius:12px;padding:16px 10px;max-width:90%;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  transition:opacity .4s ease;
}
.card:hover .content{opacity:0.7;}
.emoji{font-size:2rem;margin-bottom:10px;}
.title{font-weight:600;margin-bottom:6px;}
.desc{font-size:.9rem;color:#444;}
footer{
  width:100%;text-align:center;padding:20px 10px;
  border-top:1px solid #eee;font-size:.85rem;color:#888;
  margin-top:20px;
}

/* 광고 공간 하단 고정 */
.ad-space{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  min-height:80px;
  background-color:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  padding:10px;
  text-align:center;
  z-index:999;
}
</style>
</head>
<body>
<header>
  <div style="position:absolute;top:20px;right:20px;">
    <select onchange="setLang(this.value)" style="padding:5px 10px;border-radius:8px;border:1px solid #ddd;cursor:pointer;">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
    </select>
  </div>
  <h1 data-i18n="site_title">High Templater</h1>
  <p class="sub" data-i18n="site_subtitle">바로 복사해서 시작하는 웹 템플릿 허브</p>
</header>

<main id="categoryGrid"></main>

<footer data-i18n="footer">
  © 2025 High Templater. 템플릿은 자유롭게 사용·수정할 수 있습니다.
</footer>

<!-- 광고 공간 -->
<div class="ad-space">
  <p>광고 영역: 이미지, 텍스트, 배너 등 자유롭게 넣으세요.</p>
</div>

<script src="lang.js?v=2"></script>
<script>
const categories = [
 {emoji:"🚀",title:"Landing",desc:"히어로 + CTA 랜딩페이지",path:"templates/landing/index.html",color:"#8f80ff",key:"cat_landing"},
 {emoji:"🧑‍🎨",title:"Portfolio",desc:"작품·프로필 전시용 레이아웃",path:"templates/portfolio/index.html",color:"#57de9a",key:"cat_portfolio"},
 {emoji:"📰",title:"Blog",desc:"글 중심의 블로그 형식",path:"templates/blog/index.html",color:"#66d6ff",key:"cat_blog"},
 {emoji:"🏢",title:"Business",desc:"회사 소개 및 서비스 페이지",path:"templates/business/index.html",color:"#ffb366",key:"cat_business"},
 {emoji:"🔐",title:"Login",desc:"회원 폼 및 인증 UI",path:"templates/login/index.html",color:"#ffd76d",key:"cat_login"},
 {emoji:"🛒",title:"E-Commerce",desc:"상품카탈로그 및 결제 UI",path:"templates/ecommerce/index.html",color:"#f871ee",key:"cat_ecommerce"},
 {emoji:"📊",title:"Dashboard",desc:"관리자 통계 / 모니터링 화면",path:"templates/dashboard/index.html",color:"#00c3a5",key:"cat_dashboard"},
 {emoji:"⚙️",title:"Components",desc:"UI 컴포넌트 조합 세트",path:"templates/components/index.html",color:"#7dd3fc",key:"cat_components"},
 {emoji:"🧰",title:"Tools",desc:"유틸리티 및 간단한 웹 도구",path:"templates/tools/index.html",color:"#ff7b7b",key:"cat_tools"},
 {emoji:"🎨",title:"Creative",desc:"실험적 / 예술적 디자인",path:"templates/creative/index.html",color:"#fda4af",key:"cat_creative"}
];

// 방문자 카운트 로직
function updateVisitCount() {
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  
  let stats = JSON.parse(localStorage.getItem('ht_stats') || '{}');
  
  if (!stats.total) stats.total = 0;
  if (stats.lastVisit !== today) {
    stats.today = 0;
    stats.lastVisit = today;
  }
  
  stats.total++;
  stats.today++;
  
  localStorage.setItem('ht_stats', JSON.stringify(stats));
  
  document.getElementById('todayVisits').textContent = stats.today.toLocaleString();
  document.getElementById('totalVisits').textContent = stats.total.toLocaleString();
}

function renderGrid(dict) {
  updateVisitCount(); // 그리드 렌더링 시 방문자 수도 업데이트
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = '';
  categories.forEach(cat=>{
    const div=document.createElement('div');
    div.className='card';
    div.style.setProperty('--accent',cat.color);
    const title = dict[cat.key] || cat.title;
    const desc = dict[cat.key + '_desc'] || cat.desc;
    div.innerHTML=`
      <img class="bg-thumb" src="${cat.path.replace('index.html','preview1.png')}" alt="">
      <div class="content">
        <div class="emoji">${cat.emoji}</div>
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
      </div>`;
    div.onclick=()=>location.href=cat.path;
    grid.appendChild(div);
  });
}

// lang.js에서 renderGrid를 호출하므로 초기 렌더링은 위임됨
</script>
</body>
</html>
