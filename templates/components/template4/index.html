<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alert / Toast Component</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>토스트 알림 데모</h1>
<div class="btn-group">
  <button onclick="showAlert('성공적으로 저장되었습니다!', 'success')">성공</button>
  <button onclick="showAlert('오류가 발생했습니다.', 'error')">오류</button>
  <button onclick="showAlert('새로운 알림이 있습니다.', 'info')">정보</button>
  <button onclick="showAlert('주의가 필요합니다.', 'warning')">경고</button>
</div>

<!-- 🔹 토스트 컨테이너 -->
<div id="toastContainer" class="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
