<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아코디언 컴포넌트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>자주 묻는 질문 (FAQ)</h1>

<!-- 🔹 아코디언 컨테이너 --> 
<div class="accordion" id="faqAccordion">

  <div class="accordion-item">
    <button class="accordion-header">
      <span>Q1. 비밀번호를 잊어버렸어요.</span>
      <span class="icon">⌄</span>
    </button>
    <div class="accordion-body">
      <p>로그인 페이지의 ‘비밀번호 찾기’ 버튼을 눌러 이메일 인증을 통해 재설정하실 수 있습니다.</p>
    </div>
  </div>

  <div class="accordion-item">
    <button class="accordion-header">
      <span>Q2. 주문 취소는 어떻게 하나요?</span>
      <span class="icon">⌄</span>
    </button>
    <div class="accordion-body">
      <p>결제 후 24시간 이내에는 [마이페이지 → 주문내역]에서 직접 취소가 가능합니다.</p>
    </div>
  </div>

  <div class="accordion-item">
    <button class="accordion-header">
      <span>Q3. 배송은 얼마나 걸리나요?</span>
      <span class="icon">⌄</span>
    </button>
    <div class="accordion-body">
      <p>일반 지역은 2~3일, 제주 및 도서산간 지역은 5일 이내 배송됩니다.</p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
