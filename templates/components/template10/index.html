<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드 그리드 컴포넌트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>추천 상품</h1>

<!-- 🔹 카드 그리드 -->
<section class="card-grid">
  <div class="card">
    <img src="https://picsum.photos/id/1018/400/300" alt="상품1">
    <div class="card-overlay">
      <h2>무선 이어폰</h2>
      <p>노이즈 캔슬링 기능이 탑재된 고급형 이어폰입니다.</p>
      <button>자세히 보기</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/id/1035/400/300" alt="상품2">
    <div class="card-overlay">
      <h2>스마트 워치</h2>
      <p>건강 모니터링과 피트니스 트래킹을 한 번에!</p>
      <button>자세히 보기</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/id/1040/400/300" alt="상품3">
    <div class="card-overlay">
      <h2>휴대용 스피커</h2>
      <p>선명한 사운드와 긴 배터리로 언제 어디서나 음악을!</p>
      <button>자세히 보기</button>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
