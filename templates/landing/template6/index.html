
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 6: Signup Focus — 폼 중심 랜딩 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template 6 · Signup Focus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container head"><h1>지금 시작하세요</h1><p>이메일만 입력하면 준비 끝!</p></header>
  <main class="container">
    <form id="signup" class="card">
      <input type="email" placeholder="이메일 주소" required />
      <input type="password" placeholder="비밀번호" required />
      <button type="submit">가입하기</button>
      <p class="hint">가입하면 약관에 동의하는 것으로 간주됩니다.</p>
    </form>
  </main>
  <footer class="container foot">© 2025 High Templater</footer>
  <script src="script.js"></script>
</body>
</html>
