
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 2: Split Showcase — 좌우 분할형 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template 2 · Split Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="container bar">
      <div class="logo">High Templater</div>
      <nav><a href="#about">About</a><a href="#features">Features</a><a href="#contact">Contact</a></nav>
    </div>
  </header>

  <!-- [SPLIT] 좌측 비주얼 / 우측 텍스트 -->
  <section class="split container">
    <div class="visual" aria-hidden="true"></div>
    <div class="copy">
      <h1>더 나은 웹 경험을 디자인합니다</h1>
      <p>좌우 분할 레이아웃은 브랜드 메시지를 선명하게 전달합니다.</p>
      <div class="actions">
        <a class="btn primary" href="#features">제품 보기</a>
        <a class="btn ghost" href="#contact">문의하기</a>
      </div>
    </div>
  </section>

  <section id="features" class="container features">
    <article><h3>가독성</h3><p>텍스트-이미지 분리로 메시지 집중도 상승</p></article>
    <article><h3>확장성</h3><p>섹션 추가/순서 변경이 간편한 구조</p></article>
    <article><h3>일관성</h3><p>컴포넌트 단위 CSS로 재사용 용이</p></article>
  </section>

  <footer class="container foot">© 2025 High Templater</footer>
  <script src="script.js"></script>
</body>
</html>
