<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="cat_landing">Templates | High Templater</title>
<link rel="stylesheet" href="../common-style.css">
</head>
<body>
  <header>
    <div class="left"><a href="../../index.html">← High Templater</a></div>
  </header>

  <div class="template-bar" id="templateBar"></div>

  <main>
    <div class="preview-wrapper">
      <div class="copy-panel">
        <button class="copy-btn html" onclick="copyCode('html')">🔤 Copy HTML</button>
        <button class="copy-btn css" onclick="copyCode('css')">🎨 Copy CSS</button>
        <button class="copy-btn js" onclick="copyCode('js')">⚙️ Copy JS</button>
      </div>
      <iframe id="viewer" src="" title="Preview"></iframe>
    </div>
    <button id="prev" class="slide-btn">⟨</button>
    <button id="next" class="slide-btn">⟩</button>
  </main>

<script src="../../lang.js?v=2"></script>
<script src="../common-script.js?v=2"></script>
</body>
</html>
