
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 10: Contact Form Pro — 지도 + 문의 폼 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template 10 · Contact Form Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container head"><h1>Contact Us</h1><p>프로젝트에 대해 이야기해요.</p></header>
  <main class="container grid">
    <section class="map">
      <!-- 지도를 교체하세요 (예: 구글맵 iframe) -->
      <iframe src="https://maps.google.com/maps?q=seoul&t=&z=11&ie=UTF8&iwloc=&output=embed"></iframe>
    </section>
    <section class="form card">
      <form id="contact">
        <input name="name" placeholder="이름" required />
        <input name="email" type="email" placeholder="이메일" required />
        <textarea name="msg" rows="5" placeholder="메시지" required></textarea>
        <button type="submit">보내기</button>
      </form>
      <p class="note">SNS: @hightemplater</p>
    </section>
  </main>
  <footer class="container foot">© 2025 High Templater</footer>
  <script src="script.js"></script>
</body>
</html>
