<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Login 05 - Brand Focus Pastel</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="brand-banner">
        <div class="logo-area">
            <h1><i class="fas fa-rocket"></i> High Templater</h1>
        </div>
        <p class="slogan-text">서비스에 로그인하여 모든 기능을 사용하세요.</p>
    </header>

    <main class="login-main-area">
        <div class="login-card pastel">
            <h2>Welcome Back!</h2>
            
            <form id="loginForm5">
                <div class="input-group">
                    <label for="email5">이메일</label>
                    <input type="email" id="email5" required>
                </div>
                <div class="input-group">
                    <label for="password5">비밀번호</label>
                    <input type="password" id="password5" required>
                </div>

                <button type="submit" class="pastel-button">Secure Log In</button>
            </form>
            
            <div class="footer-options">
                <a href="#">Need Help?</a> | <a href="#">Register</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
