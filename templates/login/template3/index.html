<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Login 03 - Minimalist Background Image</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-image-body">
    <div class="login-overlay">
        <div class="login-box minimalist">
            <h2 class="logo-text">High Templater</h2>
            <p class="slogan-text">Minimal Login Experience</p>
            
            <form id="loginForm3">
                <div class="input-group">
                    <input type="email" id="email3" name="email" placeholder="이메일 주소" required>
                    </div>
                
                <div class="input-group">
                    <input type="password" id="password3" name="password" placeholder="비밀번호" required>
                </div>

                <div class="options">
                    <a href="#" class="forgot-password">비밀번호를 잊으셨나요?</a>
                </div>
                
                <button type="submit" class="minimal-button">Log In</button>
            </form>

            <div class="signup-link">
                <a href="#">회원가입 하기</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
