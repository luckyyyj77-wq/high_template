
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Login 01 - Split Screen Form (로그인 템플릿 01)</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="login-container">
        <div class="image-area">
            <div class="logo">High Templater</div>
            <p class="slogan">Welcome Back to Our Platform.</p>
            </div>

        <div class="form-area">
            <div class="form-wrapper">
                <h2>로그인 (Sign In)</h2>
                <p class="subtitle">계정에 접속하여 서비스를 이용하세요.</p>
                
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">이메일 주소 (Email Address)</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">비밀번호 (Password)</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="options">
                        <a href="#" class="forgot-password">비밀번호 찾기 (Forgot Password?)</a>
                    </div>
                    
                    <button type="submit" class="login-button">로그인</button>
                </form>

                <div class="signup-link">
                    계정이 없으신가요? <a href="#">회원가입 (Sign Up)</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
