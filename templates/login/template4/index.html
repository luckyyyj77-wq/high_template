
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Login 04 - Social Login Tabs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="login-container tab-layout">
        <div class="form-wrapper">
            <h2>로그인 옵션 (Login Options)</h2>
            <p class="subtitle">접근 방법을 선택하세요.</p>

            <div class="tab-buttons">
                <button data-tab="email-login" class="active">이메일/PW 로그인</button>
                <button data-tab="social-login">소셜 로그인</button>
            </div>

            <div id="email-login" class="tab-content active">
                <form id="loginForm4-email">
                    <div class="input-group">
                        <label for="email4">Email</label>
                        <input type="email" id="email4" required>
                    </div>
                    <div class="input-group">
                        <label for="password4">Password</label>
                        <input type="password" id="password4" required>
                    </div>
                    <button type="submit" class="login-button">Log In</button>
                </form>
            </div>

            <div id="social-login" class="tab-content hidden">
                <button class="social-btn google"><i class="fab fa-google"></i> Google로 계속하기</button>
                <button class="social-btn kakao"><i class="fas fa-comment"></i> 카카오로 계속하기</button>
                <button class="social-btn naver"><i class="fas fa-n"></i> 네이버로 계속하기</button>
            </div>
            
            <div class="signup-link">
                <a href="#">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
