<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login 02 - Dark Mode Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-card dark-mode">
    <div class="logo">High Templater</div>
    
    <div class="header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account to continue.</p>
    </div>
    
    <form id="loginForm">
        <div class="input-group">
            <label for="email">이메일 주소 (Email)</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호 (Password)</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="options">
            <label class="checkbox-container">
                <input type="checkbox" checked>
                <span class="checkmark"></span>
                자동 로그인 (Remember Me)
            </label>
            <a href="#" class="forgot-password">비밀번호 찾기?</a>
        </div>

        <button type="submit" class="login-button">Sign In (로그인)</button>
    </form>

    <div class="signup-link">
        계정이 없으신가요? <a href="#">Create an Account</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
