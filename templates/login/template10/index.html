<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNS 로그인</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sns-container">
    <div class="sns-box">
      <h1>환영합니다 👋</h1>
      <p class="sub">소셜 계정으로 간편하게 로그인하세요</p>

      <div class="sns-buttons">
        <button class="sns-btn google" data-provider="Google">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google로 로그인
        </button>

        <button class="sns-btn kakao" data-provider="Kakao">
          <img src="https://www.svgrepo.com/show/448234/kakaotalk.svg" alt="Kakao"> 카카오로 로그인
        </button>

        <button class="sns-btn apple" data-provider="Apple">
          <img src="https://www.svgrepo.com/show/448231/apple.svg" alt="Apple"> Apple로 로그인
        </button>
      </div>

      <p class="footer-text">
        또는 <a href="#">이메일로 로그인</a>
      </p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
