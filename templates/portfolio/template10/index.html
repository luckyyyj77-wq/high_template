
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 10: Portfolio Grid Pro — 필터 가능한 카드 그리드 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio · Grid Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container head">
    <h1>Works</h1>
    <div class="filters">
      <button data-tag="all" class="active">All</button>
      <button data-tag="web">Web</button>
      <button data-tag="app">App</button>
      <button data-tag="brand">Brand</button>
    </div>
  </header>

  <main class="container grid">
    <article class="card" data-tags="web"><h3>웹 프로젝트</h3><p>설명</p></article>
    <article class="card" data-tags="app"><h3>앱 프로젝트</h3><p>설명</p></article>
    <article class="card" data-tags="brand"><h3>브랜딩</h3><p>설명</p></article>
    <article class="card" data-tags="web app"><h3>웹/앱</h3><p>설명</p></article>
    <article class="card" data-tags="web brand"><h3>웹/브랜드</h3><p>설명</p></article>
    <article class="card" data-tags="app brand"><h3>앱/브랜드</h3><p>설명</p></article>
  </main>

  <footer class="container foot">© 2025 Your Name</footer>
  <script src="script.js"></script>
</body>
</html>
