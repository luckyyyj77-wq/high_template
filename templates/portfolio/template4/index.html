
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 4: Photographer Grid — Masonry + Lightbox -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio · Photographer Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container head"><h1>Photography</h1><p class="sub">자유로운 Masonry 그리드</p></header>
  <main class="container masonry">
    <!-- Masonry-like with column-count -->
    <img src="https://picsum.photos/seed/a/600/400" alt="a">
    <img src="https://picsum.photos/seed/b/300/500" alt="b">
    <img src="https://picsum.photos/seed/c/500/600" alt="c">
    <img src="https://picsum.photos/seed/d/600/500" alt="d">
    <img src="https://picsum.photos/seed/e/400/500" alt="e">
    <img src="https://picsum.photos/seed/f/500/400" alt="f">
  </main>
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox"><img src="" alt="preview"></div>
  <footer class="container foot">© 2025 Your Name</footer>
  <script src="script.js"></script>
</body>
</html>
