
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Template 1: Personal Intro — 자기소개형 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio · Personal Intro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- [HEADER] 최소 네비 -->
  <header class="container top">
    <div class="brand">Your Name</div>
    <nav><a href="#about">About</a><a href="#work">Work</a><a href="#contact">Contact</a></nav>
  </header>

  <!-- [HERO] 아바타 + 한줄 소개 -->
  <section class="container hero">
    <img class="avatar" src="https://picsum.photos/200" alt="avatar" />
    <h1>안녕하세요, 저는 <span class="accent">크리에이터</span>입니다.</h1>
    <p class="lead">UI/UX · 프런트엔드 · 프로덕트 설계</p>
    <div class="links">
      <a class="btn" href="#">GitHub</a>
      <a class="btn ghost" href="#">LinkedIn</a>
      <a class="btn ghost" href="#contact">Contact</a>
    </div>
  </section>

  <!-- [ABOUT] 짧은 소개 -->
  <section id="about" class="container about">
    <h2>About</h2>
    <p>사용자 문제를 해결하는 경험을 만듭니다. 빠른 프로토타이핑과 반복을 좋아합니다.</p>
  </section>

  <!-- [FOOTER] -->
  <footer id="contact" class="container foot">© 2025 Your Name</footer>
  <script src="script.js"></script>
</body>
</html>
