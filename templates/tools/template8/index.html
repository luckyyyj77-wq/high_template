<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미니 메모장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="note-container">
  <header>
    <h1>🗒️ 미니 메모장</h1>
    <div class="top-buttons">
      <button id="toggleTheme">🌙</button>
      <button id="clearNotes">🗑️</button>
    </div>
  </header>

  <textarea id="noteArea" placeholder="여기에 메모를 작성하세요..."></textarea>
  <p class="status" id="status">자동 저장됨</p>
</main>

<script src="script.js"></script>
</body>
</html>
