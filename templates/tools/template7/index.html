<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR 코드 생성기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="qrcode-container">
  <h1>📱 QR 코드 생성기</h1>

  <!-- 🔹 입력 -->
  <input type="text" id="textInput" placeholder="텍스트나 URL을 입력하세요">
  
  <!-- 🔹 옵션 -->
  <div class="options">
    <label>크기: <span id="sizeValue">200</span>px</label>
    <input type="range" id="sizeRange" min="100" max="400" value="200">

    <label>전경색:</label>
    <input type="color" id="fgColor" value="#000000">

    <label>배경색:</label>
    <input type="color" id="bgColor" value="#ffffff">
  </div>

  <!-- 🔹 QR 미리보기 -->
  <canvas id="qrCanvas" width="200" height="200"></canvas>

  <!-- 🔹 버튼 -->
  <div class="btns">
    <button id="generateBtn">생성</button>
    <button id="downloadBtn">다운로드</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
