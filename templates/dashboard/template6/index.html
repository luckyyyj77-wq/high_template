<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기본 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>관리자 대시보드</h1>
  <button id="logoutBtn">로그아웃</button>
</header>

<main class="dashboard">
  <!-- 🔹 요약 카드 -->
  <section class="summary">
    <div class="card">
      <h2>매출</h2>
      <p class="value">₩1,240,000</p>
      <p class="desc">이번 달 총 매출</p>
    </div>
    <div class="card">
      <h2>주문</h2>
      <p class="value">128건</p>
      <p class="desc">오늘 처리된 주문</p>
    </div>
    <div class="card">
      <h2>신규회원</h2>
      <p class="value">56명</p>
      <p class="desc">이번 주 가입자</p>
    </div>
  </section>

  <!-- 🔹 주문 리스트 테이블 -->
  <section class="table-section">
    <h2>최근 주문 내역</h2>
    <table>
      <thead>
        <tr>
          <th>주문번호</th>
          <th>고객명</th>
          <th>상품</th>
          <th>금액</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody id="orderTableBody">
        <!-- JS에서 데이터 로드 -->
      </tbody>
    </table>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
