<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Dashboard 02 - Light/Dark Mode Toggle</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="light-mode">
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo-text">HighDash</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active"><a href="#"><i class="fas fa-chart-pie"></i> 개요</a></li>
                    <li class="nav-item"><a href="#"><i class="fas fa-project-diagram"></i> 프로젝트</a></li>
                    <li class="nav-item"><a href="#"><i class="fas fa-envelope"></i> 메시지</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="theme-toggle-btn">
                    <i class="fas fa-moon"></i> 다크 모드 전환
                </button>
            </div>
        </aside>

        <div class="main-content">
            <header class="top-bar">
                <div class="page-title">모드 전환 대시보드</div>
                <div class="user-profile">안녕하세요, 관리자님!</div>
            </header>

            <main class="content-area">
                
                <div class="alert-box">
                    <i class="fas fa-lightbulb"></i> 현재 테마: <span id="currentTheme">라이트 모드</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-users icon success"></i>
                        <p class="label">Total Users</p>
                        <p class="value">2,400</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-shopping-bag icon primary"></i>
                        <p class="label">Orders Pending</p>
                        <p class="value">45</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-star icon warning"></i>
                        <p class="label">Avg. Rating</p>
                        <p class="value">4.8</p>
                    </div>
                </div>

                <div class="section">
                    <h3>최근 보고서 요약</h3>
                    <p class="report-text">
                        이번 달 데이터 분석에 따르면 사용자 만족도가 전반적으로 상승했습니다. 
                        다크 모드는 시력 보호와 전력 절약에 도움이 됩니다.
                    </p>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
