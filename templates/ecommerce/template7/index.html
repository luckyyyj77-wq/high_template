<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의하기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="contact-container">
  <h1>문의하기</h1>
  <p class="sub">궁금하신 점이나 불편사항을 아래에 남겨주세요.</p>

  <!-- 🔹 문의 폼 -->
  <form id="contactForm">
    <!-- 이름 -->
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="홍길동" required>

    <!-- 이메일 -->
    <label for="email">이메일</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <!-- 문의유형 -->
    <label for="type">문의유형</label>
    <select id="type" required>
      <option value="">선택해주세요</option>
      <option value="order">주문 관련 문의</option>
      <option value="shipping">배송 관련 문의</option>
      <option value="refund">환불 / 교환 문의</option>
      <option value="other">기타</option>
    </select>

    <!-- 메시지 -->
    <label for="message">메시지</label>
    <textarea id="message" rows="5" placeholder="내용을 입력해주세요..." required></textarea>

    <!-- 제출 버튼 -->
    <button type="submit" class="submit-btn">문의 보내기</button>
  </form>

  <!-- 결과 메시지 -->
  <div id="resultBox" class="result-box hidden">
    <p id="resultText"></p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
