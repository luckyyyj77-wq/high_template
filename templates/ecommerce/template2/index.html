<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>E-commerce 02 - Product Detail (제품 상세 페이지)</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="detail-header">
        <div class="logo">HighShop</div>
        <div class="breadcrumb">
            <a href="#">홈</a> / <a href="#">상의</a> / <span>코튼 셔츠</span>
        </div>
    </header>

    <main class="product-detail-container">
        <section class="image-gallery">
            <div class="main-image">
                <img id="mainProductImage" src="https://picsum.photos/600/800?random=1" alt="메인 제품 이미지" data-index="1">
            </div>
            <div class="thumbnail-list">
                <img class="thumbnail active" src="https://picsum.photos/100/130?random=1" data-full-src="https://picsum.photos/600/800?random=1" alt="썸네일 1">
                <img class="thumbnail" src="https://picsum.photos/100/130?random=2" data-full-src="https://picsum.photos/600/800?random=2" alt="썸네일 2">
                <img class="thumbnail" src="https://picsum.photos/100/130?random=3" data-full-src="https://picsum.photos/600/800?random=3" alt="썸네일 3">
            </div>
        </section>

        <section class="product-info">
            <h1 class="product-name">프리미엄 린넨 코튼 셔츠</h1>
            <p class="product-brand">by High Brand</p>
            
            <div class="price-rating">
                <div class="product-price">129,000원</div>
                <div class="product-rating">
                    <i class="fas fa-star"></i> 4.5 (리뷰 120개)
                </div>
            </div>

            <p class="product-description">
                고급 린넨과 코튼 혼방 소재로 제작되어 통기성이 우수하고 착용감이 뛰어난 셔츠입니다. 봄/여름 시즌에 완벽합니다.
            </p>

            <div class="options-group">
                <h4>색상 (Color)</h4>
                <div class="color-options">
                    <button class="color-chip red" data-option="red"></button>
                    <button class="color-chip blue selected" data-option="blue"></button>
                    <button class="color-chip white" data-option="white"></button>
                </div>
            </div>

            <div class="options-group">
                <h4>사이즈 (Size)</h4>
                <div class="size-options">
                    <button class="size-chip" data-option="S">S</button>
                    <button class="size-chip selected" data-option="M">M</button>
                    <button class="size-chip" data-option="L">L</button>
                    <button class="size-chip disabled" data-option="XL">XL (품절)</button>
                </div>
            </div>

            <div class="action-group">
                <div class="quantity-selector">
                    <button id="qtyMinus">-</button>
                    <input type="text" id="quantityInput" value="1" readonly>
                    <button id="qtyPlus">+</button>
                </div>
                <button class="add-to-cart-btn">
                    <i class="fas fa-shopping-basket"></i> 장바구니 담기
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
