
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Business Template 7: Business Contact -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business · Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container head"><h1>문의하기</h1><p class="sub">지도 + 연락처 폼</p></header>
  <main class="container grid">
    <section class="map"><iframe src="https://maps.google.com/maps?q=seoul&t=&z=11&ie=UTF8&iwloc=&output=embed"></iframe></section>
    <section class="form">
      <form id="contact">
        <input name="name" placeholder="이름" required>
        <input name="email" type="email" placeholder="이메일" required>
        <textarea name="msg" rows="5" placeholder="메시지" required></textarea>
        <button type="submit">보내기</button>
      </form>
    </section>
  </main>
  <footer class="container foot">© 2025 Acme Corp</footer>
  <script src="script.js"></script>
</body>
</html>
